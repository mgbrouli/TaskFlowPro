<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}TaskFlow Pro{% endblock %}</title>
    <!-- Tailwind CSS via CDN para estilização rápida e moderna -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col justify-between">
    <header class="bg-indigo-600 text-white p-4 shadow-md">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold">TaskFlow Pro</h1>
            <nav class="space-x-4">
                <a href="/" class="hover:underline">Início</a>
            </nav>
        </div>
    </header>

    <main class="container mx-auto p-4 flex-grow">
        {% block content %}{% endblock %}
    </main>

    <footer class="bg-white text-center p-4 text-gray-500 text-sm border-t">
        &copy; 2026 TaskFlow Pro. Desenvolvido para portfólio.
    </footer>
</body>
</html>
